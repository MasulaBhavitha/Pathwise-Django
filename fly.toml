app = "pathwise-roadmap"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "*"
  SQLITE_PATH = "/data/db.sqlite3"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "90s"
    method = "GET"
    path = "/"

[[mounts]]
  source = "pathwise_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
